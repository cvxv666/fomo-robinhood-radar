[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fomo-robinhood-radar"
version = "0.1.0"
description = "FOMO Robinhood Radar: find the fomo.family traders worth watching on Robinhood Chain, track their fills on-chain, score them with Claude."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "anthropic>=0.40",
  "typer>=0.12",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
capture = ["playwright>=1.45"]
board = ["playwright>=1.45"]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn[standard]>=0.32", "httpx>=0.27"]

[project.scripts]
fomo-radar = "fomo_agent.cli:app"
fomo-agent = "fomo_agent.cli:app"  # kept so existing scripts keep working

[tool.setuptools.packages.find]
include = ["fomo_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
