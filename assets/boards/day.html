<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOMO Radar — the day</title>
<!--
  The day (or the week) as one board, filled from window.DAY, which pipeline/board.py writes in
  from the push ledger: the alerts of the window with their hour peak and where they sit now, the
  tape underneath. Nothing here is advice; nothing here is recomputed to look better. The layout is
  the one drawn by hand for 17 Sep 2026 (assets/cases/day-2026-09-17), made to take any day.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  :root { --black:#000; --white:#fff; --carbon:#606060; --graphite:#949494; --line:#2a2a2a; --green:#00ff85; --crimson:#ff003d;
          --amber:#ff8a00; --yellow:#fcff76; --violet:#6100ff;
          --sans:"Space Grotesk", system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, monospace; }
  html, body { margin:0; height:100%; background:var(--black); color:var(--white); overflow:hidden; font-family:var(--mono); }
  .stage { position:fixed; inset:0; display:grid; place-items:center; }
  .board { position:relative; width:1600px; height:900px; transform-origin:center center; background:var(--black); overflow:hidden; }
  .frame { position:absolute; inset:14px; border:2px solid var(--white); pointer-events:none; }
  .abs { position:absolute; }
  .eyebrow { left:40px; top:44px; font-size:15px; font-weight:700; letter-spacing:.14em; white-space:nowrap; }
  .eyebrow span { color:var(--graphite); font-weight:400; }
  .led { display:inline-block; width:11px; height:11px; background:var(--green); margin-right:12px; vertical-align:-1px; }
  .big { font-family:var(--sans); font-weight:700; letter-spacing:-.02em; line-height:.86; }
  #hero { left:34px; top:84px; font-size:210px; color:var(--green); }
  #hero small { font-size:96px; color:var(--white); letter-spacing:-.01em; vertical-align:18px; margin-left:6px; }
  #hero-l { left:520px; top:98px; font-size:54px; line-height:1.02; letter-spacing:.005em; white-space:nowrap; }
  #hero-s { left:524px; top:232px; font-size:17px; font-weight:700; letter-spacing:.1em; color:var(--graphite); line-height:1.75; white-space:nowrap; }
  #hero-s b { color:var(--white); }
  #hero-s i { color:var(--crimson); font-style:normal; }
  .rule { position:absolute; height:2px; background:var(--white); }
  .hair { position:absolute; height:1px; background:var(--line); }
  .h { font-size:13px; font-weight:700; letter-spacing:.14em; white-space:nowrap; }
  .h span { color:var(--graphite); font-weight:400; }
  /* the 24 hours */
  #tl { left:40px; top:330px; width:1520px; height:76px; }
  .tick { position:absolute; top:44px; width:1px; height:10px; background:var(--carbon); }
  .tick-l { position:absolute; top:57px; font-size:11px; color:var(--carbon); letter-spacing:.08em; transform:translateX(-50%); white-space:nowrap; }
  .mark { position:absolute; top:48px; width:10px; height:10px; background:var(--green); transform:translateX(-50%) rotate(45deg); }
  .mark.dead { background:var(--crimson); }
  .mark-l { position:absolute; font-size:12px; font-weight:700; letter-spacing:.08em; transform:translateX(-50%); white-space:nowrap; }
  .mark-l.up { top:6px; } .mark-l.down { top:25px; }
  .mark-l.l { transform:none; } .mark-l.r { transform:translateX(-100%); }
  /* the six */
  .row { position:absolute; left:40px; width:1520px; height:54px; }
  .row .t { position:absolute; left:0; top:19px; font-size:13px; color:var(--graphite); letter-spacing:.06em; }
  .row .k { position:absolute; left:70px; top:20px; font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--graphite); }
  .row .k.b { color:var(--green); }
  .row .k.thin { color:var(--amber); }
  .row .sym { position:absolute; left:205px; top:11px; font-family:var(--sans); font-weight:700; font-size:25px; letter-spacing:-.01em; white-space:nowrap; }
  .row .in { position:absolute; left:410px; top:19px; font-size:12px; color:var(--graphite); letter-spacing:.06em; white-space:nowrap; }
  .row .in b { color:var(--white); font-weight:700; }
  .row .bar { position:absolute; top:20px; height:14px; background:var(--green); }
  .row .under { position:absolute; top:20px; height:14px; background:var(--crimson); }
  .row .nowtick { position:absolute; top:14px; width:3px; height:26px; background:var(--white); }
  .row .pk { position:absolute; top:17px; font-size:15px; font-weight:700; letter-spacing:.04em; white-space:nowrap; color:var(--green); }
  .row .pk span { color:var(--graphite); font-weight:400; font-size:12px; letter-spacing:.08em; }
  .row .nw { position:absolute; right:0; top:17px; font-size:15px; font-weight:700; letter-spacing:.04em; white-space:nowrap; }
  .row .nw em { color:var(--amber); font-style:normal; font-weight:400; font-size:12px; letter-spacing:.08em; margin-left:6px; }
  .row .nw span { color:var(--graphite); font-weight:400; font-size:12px; letter-spacing:.08em; }
  .row .nw span:first-child { margin-right:6px; }
  .row .nw.red { color:var(--crimson); }
  .entry { position:absolute; width:2px; background:var(--white); }
  .scale-l { position:absolute; font-size:11px; color:var(--carbon); letter-spacing:.08em; transform:translateX(-50%); white-space:nowrap; }
  /* the tape */
  .stat { position:absolute; top:774px; width:270px; border-top:2px solid var(--white); }
  .stat .v { position:absolute; left:0; top:10px; font-family:var(--sans); font-weight:700; font-size:46px; line-height:1; letter-spacing:-.01em; white-space:nowrap; }
  .stat .kk { position:absolute; left:0; top:64px; font-size:12px; font-weight:700; letter-spacing:.14em; color:var(--graphite); white-space:nowrap; }
  .foot { position:absolute; top:862px; font-size:11px; letter-spacing:.1em; color:var(--carbon); white-space:nowrap; }
  .foot b { color:var(--graphite); font-weight:700; }
  .row.tight .sym { font-size: 21px; top: 9px; }
  .row.tight .in { top: 15px; } .row.tight .t, .row.tight .k { top: 15px; }
  .row.tight .bar, .row.tight .under { top: 15px; height: 12px; } .row.tight .nowtick { top: 10px; height: 22px; }
  .row.tight .pk, .row.tight .nw { top: 13px; }
  .row .nw em.warn { color: var(--crimson); }
  #more { position: absolute; left: 40px; font-size: 12px; letter-spacing: .1em; color: var(--graphite); }
  #quiet { position: absolute; left: 40px; top: 470px; font-family: var(--sans); font-weight: 300; font-size: 28px; color: var(--graphite); letter-spacing: .02em; }
</style>
</head>
<body>
<div class="stage"><div class="board" id="board">
  <div class="frame"></div>

  <div class="abs eyebrow"><span class="led"></span>FOMO ROBINHOOD RADAR  <span>·</span>  <span id="title" style="color:#fff"></span>  <span>·</span>  <span id="subtitle" style="color:#fff"></span>  <span>·  <span id="window"></span></span></div>
  <div class="abs big" id="hero"></div>
  <div class="abs big" id="hero-l"></div>
  <div class="abs" id="hero-s"></div>

  <div class="rule" style="left:40px;top:300px;width:1520px"></div>
  <div class="abs h" style="left:40px;top:312px"><span id="tl-title">THE 24 HOURS</span>  <span>·  WHEN EACH ALERT WENT OUT</span></div>
  <div class="abs" id="tl"></div>

  <div class="rule" style="left:40px;top:404px;width:1520px"></div>
  <div class="abs h" style="left:40px;top:416px"><span id="section"></span>  <span>·  PEAK AFTER THE CALL, AND WHERE IT SITS NOW  ·  IN THE PRICE THE COHORT PAID</span></div>
  <div id="rows"></div>
  <div id="quiet" hidden>No alert went out. The bar is the bar.</div>
  <div id="more" hidden></div>

  <div class="rule" style="left:40px;top:752px;width:1520px"></div>
  <div id="stats"></div>

  <div class="foot" style="left:40px">PEAK AND NOW FROM THE POOL'S 5-MIN CANDLES, ENTRY = LAST TRUSTED FILL BEFORE THE CALL  ·  <b>NOTHING HERE IS ADVICE</b></div>
  <div class="foot" style="right:40px" id="foot-right"></div>
</div></div>
<script>
/*DAY*/
</script>
<script>
(() => {
  'use strict';
  const D = window.DAY;
  if (!D) return;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  $('title').textContent = D.title; $('subtitle').textContent = D.subtitle; $('window').textContent = D.window;
  $('hero').innerHTML = D.hero.quiet ? '0' : `${D.hero.n}<small>/${D.hero.of}</small>`;
  if (D.hero.quiet) $('hero').style.color = '#fff';
  $('hero-l').innerHTML = D.hero.label.map(esc).join('<br>');
  $('hero-s').innerHTML = D.hero.sub1 + '<br>' + D.hero.sub2;
  $('tl-title').textContent = D.hours <= 24 ? 'THE 24 HOURS' : 'THE 7 DAYS';
  $('section').textContent = D.section;
  $('foot-right').innerHTML = D.foot_right.replace(/@(\w+)/, '<b>@$1</b>').replace(/([a-z0-9.-]+\.app)$/i, '<b>$1</b>');

  // the timeline: one hairline, the ticks, a diamond per alert
  const tl = $('tl');
  const W = 1520, x = m => Math.round(W * m / D.timeline.minutes);
  const line = document.createElement('div'); line.className = 'hair'; line.style.cssText = 'left:0;top:52px;width:1520px;background:#606060'; tl.appendChild(line);
  D.timeline.ticks.forEach(k => {
    const t = document.createElement('div'); t.className = 'tick'; t.style.left = x(k.min) + 'px'; tl.appendChild(t);
    const l = document.createElement('div'); l.className = 'tick-l'; l.style.left = x(k.min) + 'px'; l.textContent = k.label; tl.appendChild(l);
  });
  // labels on up to four shelves: each takes the first shelf where the previous label has ended
  // three shelves above the line; when none is free the time is dropped from the label first
  const shelves = [6, 25, -13];
  const ends = [-1e9, -1e9, -1e9];
  [...D.timeline.marks].sort((a, b) => a.min - b.min).forEach(s => {
    const cx = x(s.min);
    const d = document.createElement('div'); d.className = 'mark' + (s.dead ? ' dead' : ''); d.style.left = cx + 'px'; tl.appendChild(d);
    const anchor = cx < 110 ? 'l' : cx > 1410 ? 'r' : '';
    const place = text => {
      const w = text.length * 9;
      const x0 = anchor === 'l' ? cx : anchor === 'r' ? cx - w : cx - w / 2;
      const k = ends.findIndex(e => e < x0 - 10);
      return k < 0 ? null : (ends[k] = x0 + w, k);
    };
    let text = '$' + s.sym + '  ' + s.at, k = place(text), left = cx, cls = anchor;
    if (k === null) { text = '$' + s.sym; k = place(text); }
    if (k === null) {
      // nowhere near the mark is free: the emptiest shelf, just past whatever is on it
      k = ends.indexOf(Math.min(...ends)); left = ends[k] + 12; cls = 'l'; ends[k] = left + text.length * 8.6;
    }
    const l = document.createElement('div'); l.className = 'mark-l ' + cls; l.style.left = left + 'px'; l.style.top = shelves[k] + 'px';
    l.textContent = text; tl.appendChild(l);
  });

  // the rows: a bar from entry to peak, and under the entry, how far it has fallen back
  const rows = $('rows');
  const R = D.rows;
  if (!R.length) { $('quiet').hidden = false; }
  const maxPeak = Math.max(2, ...R.map(r => r.peak || 0), ...R.map(r => r.now || 0));
  const MAX = Math.min(12, Math.max(5, Math.ceil(maxPeak)));
  const X0 = 620, XW = 640;
  const px = v => X0 + Math.round(XW * Math.min(v, MAX) / MAX);
  const tight = R.length > 6;
  const top0 = 446, step = tight ? Math.floor(282 / R.length) : 50;
  if (R.length) {
    const entry = document.createElement('div'); entry.className = 'entry'; entry.style.cssText = `left:${40 + px(1)}px;top:${top0 - 4}px;height:${step * R.length + 2}px`; rows.appendChild(entry);
    const labels = [[1, '1× ENTRY']]; for (let v = 2; v <= MAX; v += (MAX > 8 ? 2 : 1)) labels.push([v, '×' + v]);
    labels.forEach(([v, t]) => {
      const l = document.createElement('div'); l.className = 'scale-l'; l.style.cssText = `left:${40 + px(v)}px;top:${top0 + step * R.length + 6}px`; l.textContent = t; rows.appendChild(l);
      if (v > 1) { const h = document.createElement('div'); h.className = 'hair'; h.style.cssText = `left:${40 + px(v)}px;top:${top0 - 4}px;width:1px;height:${step * R.length + 2}px`; rows.appendChild(h); }
    });
  }
  const fx = v => (v === null || v === undefined) ? '—' : '×' + v.toFixed(2);
  R.forEach((s, i) => {
    const r = document.createElement('div'); r.className = 'row' + (tight ? ' tight' : ''); r.style.top = (top0 + i * step) + 'px';
    const tag = '<span class="k' + (s.kind === 'BURST' ? ' b' : '') + '">' + esc(s.kind) + '</span>';
    const warn = s.note && s.note !== 'OPEN';
    const nowTxt = '<span>NOW</span>' + fx(s.now) + (s.note ? `<em class="${warn ? 'warn' : ''}">${esc(s.note)}</em>` : '');
    const inTxt = (s.buyers ? `<b>${s.buyers}</b> WALLETS` : '') + (s.usd ? ` · <b>${esc(s.usd)}</b> IN` : '') + (!s.buyers && !s.usd ? `<b>${s.chats}</b> CHATS` : '');
    let bars = '';
    if (s.peak !== null && s.peak !== undefined) {
      bars += `<div class="bar" style="left:${px(1)}px;width:${Math.max(0, px(s.peak) - px(1))}px"></div>`;
      bars += `<div class="pk" style="left:${px(Math.max(s.peak, 1)) + 12}px">×${s.peak.toFixed(2)}${s.peakMin !== null && s.peakMin !== undefined ? ` <span>AT +${s.peakMin} MIN</span>` : ''}</div>`;
    }
    if (s.now !== null && s.now !== undefined) {
      bars += s.now < 1 ? `<div class="under" style="left:${px(s.now)}px;width:${px(1) - px(s.now)}px"></div>` : `<div class="nowtick" style="left:${px(s.now)}px"></div>`;
    }
    r.innerHTML = `<div class="t">${s.at}</div>${tag}<div class="sym">$${esc(s.sym)}</div><div class="in">${inTxt}</div>` + bars +
      `<div class="nw${(s.now !== null && s.now !== undefined && s.now < 1) ? ' red' : ''}">${nowTxt}</div>`;
    rows.appendChild(r);
  });

  // the tape
  const st = $('stats');
  D.stats.forEach((s, i) => {
    const d = document.createElement('div'); d.className = 'stat'; d.style.left = (40 + i * 304) + 'px'; if (i === D.stats.length - 1) d.style.width = '304px';
    d.innerHTML = `<div class="v"${s.green ? ' style="color:var(--green)"' : ''}>${esc(s.v)}</div><div class="kk">${esc(s.k)}</div>`;
    st.appendChild(d);
  });

  const board = $('board');
  const fit = () => { const k = Math.min(innerWidth / 1600, innerHeight / 900); board.style.transform = `scale(${k})`; };
  addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
