<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOMO Radar — day one</title>
<!--
  The first day with subscribers, as one board: eight pushes and how far each went, five past
  2x. Everything is on screen from the first frame; what moves is the light - a scan crossing
  the bars, a reading cursor walking the rows, energy running along the bars that made it, the
  2x line flowing, the day's join wave shimmering, the brain turning. The numbers are the day's
  own (12 Sep 2026, UTC): the peak is the pool's high after the message. ?still=1 holds still.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@300;400;700&display=swap">
<style>
  :root { --black:#000; --white:#fff; --carbon:#606060; --graphite:#949494; --green:#00ff85; --crimson:#ff003d;
          --amber:#ff8a00; --yellow:#fcff76; --violet:#6100ff; --cyan:#8fd9ff;
          --sans:"Space Grotesk", system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, monospace; }
  html, body { margin:0; height:100%; background:var(--black); color:var(--white); overflow:hidden; }
  .stage { position:fixed; inset:0; display:grid; place-items:center; }
  .board { position:relative; width:1600px; height:900px; transform-origin:center center; background:var(--black); }
  .board > svg { position:absolute; inset:0; width:1600px; height:900px; }
  #brain { position:absolute; left:1330px; top:18px; width:210px; height:150px; }
  text { fill:var(--white); font-family:var(--mono); }
  .sans { font-family:var(--sans); } .b { font-weight:700; } .l { font-weight:300; }
  .g { fill:var(--graphite); } .c { fill:var(--carbon); } .gr { fill:var(--green); } .cr { fill:var(--crimson); } .am { fill:var(--amber); } .ye { fill:var(--yellow); }
  .led { animation:blink 2.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .flow { stroke-dasharray:6 6; animation:flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset:-12; } }
  .breathe { animation:breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity:.72; } }
  .mark { animation:mark 2.8s ease-in-out infinite; }
  @keyframes mark { 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { .led, .flow, .breathe, .mark { animation:none; } }
</style>
</head>
<body>
<div class="stage"><div class="board" id="board"><svg id="art" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg"></svg><canvas id="brain"></canvas></div></div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const reduced = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) || q.has('still');
  const board = document.getElementById('board');
  const fit = () => { const s = Math.min(innerWidth / 1600, innerHeight / 900); board.style.transform = `scale(${s})`; };
  addEventListener('resize', fit); fit();

  // ── the day's own numbers, UTC. Peaks are the pool's high against the push price.
  const PUSHES = [
    { t: '11:07', h: 11.12, kind: 'LAUNCH', sym: 'Maple',    peak: 1.6,  now: 0.06 },
    { t: '13:55', h: 13.92, kind: 'LAUNCH', sym: 'AMD',      peak: 2.22, now: 0.23 },
    { t: '14:08', h: 14.14, kind: 'LAUNCH', sym: 'FRONTIER', peak: 4.05, now: 0.50, note: '5m 52s after the pool' },
    { t: '14:11', h: 14.19, kind: 'BURST',  sym: 'FRONTIER', peak: 2.49, now: 0.33, note: '7 wallets · 16 s to the phone' },
    { t: '14:41', h: 14.69, kind: 'LAUNCH', sym: 'SWARM',    peak: 7.86, now: 2.9 },
    { t: '14:56', h: 14.93, kind: 'LAUNCH', sym: 'LONGCAT',  peak: 1.84, now: 0.45 },
    { t: '19:56', h: 19.93, kind: 'LAUNCH', sym: 'TWINE',    peak: 2.5,  now: 0.88 },
    { t: '21:01', h: 21.02, kind: 'LAUNCH', sym: 'UNITY',    peak: 1.25, now: 0.07 },
  ];
  const JOINS = [[12, 3], [13, 0], [14, 22], [15, 73], [16, 44], [17, 37], [18, 11], [19, 11], [20, 14], [21, 8], [22, 8], [23, 7], [24, 7], [25, 5], [26, 4], [27, 4], [28, 4], [29, 1], [30, 3], [31, 3], [32, 2]];
  const HIT = PUSHES.filter((p) => p.peak >= 2);
  const peaks = PUSHES.map((p) => p.peak).sort((a, b) => a - b);
  const median = (peaks[3] + peaks[4]) / 2;

  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('art');
  const el = (tag, attrs = {}, parent = svg, text = null) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text !== null) e.textContent = text; parent.appendChild(e); return e; };
  const txt = (x, y, s, attrs = {}, parent = svg) => el('text', { x, y, ...attrs }, parent, s);
  const line = (x1, y1, x2, y2, stroke, attrs = {}, parent = svg) => el('line', { x1, y1, x2, y2, stroke, ...attrs }, parent);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const W = { WHITE: '#fff', CARBON: '#606060', GRAPHITE: '#949494', GREEN: '#00ff85', CRIMSON: '#ff003d', AMBER: '#ff8a00', YELLOW: '#fcff76', VIOLET: '#6100ff', BLACK: '#000' };
  const pad = 60;

  // ── head
  el('circle', { cx: pad + 4, cy: 56, r: 4, fill: W.GREEN, class: 'led' });
  txt(pad + 18, 61, 'FOMO ROBINHOOD RADAR  ·  12 SEP 2026  ·  THE FIRST DAY WITH SUBSCRIBERS  ·  UTC', { class: 'g', 'font-size': 12, 'letter-spacing': '.13em' });
  txt(pad - 3, 132, '5/8 SIGNALS CROSSED 2×', { class: 'sans l', 'font-size': 66, 'letter-spacing': '.06em' });
  txt(pad, 164, 'eight pushes to the bot in a day  ·  five went past double  ·  the peak is the pool’s high after the message, not our tape', { class: 'g', 'font-size': 12.5, 'letter-spacing': '.06em' });
  line(pad, 186, 1540, 186, W.CARBON);

  // ── the race: eight pushes from 1x to their peak, a 2x line to beat, on a log scale
  const R = { x0: 330, x1: 1020, y0: 236, rowH: 52 };
  const LMAX = Math.log(10);
  const X = (m) => R.x0 + (Math.log(Math.max(1, m)) / LMAX) * (R.x1 - R.x0);
  const bottom = R.y0 + PUSHES.length * R.rowH - 6;
  txt(pad, R.y0 - 16, 'THE PUSHES  ·  PEAK × THE PRICE AT THE MOMENT OF THE MESSAGE', { class: 'g', 'font-size': 11, 'letter-spacing': '.13em' });
  for (const m of [1, 3, 5, 10]) {
    line(X(m), R.y0, X(m), bottom, W.CARBON, { 'stroke-dasharray': '4 4' });
    txt(X(m), bottom + 16, `${m}×`, { class: 'g', 'font-size': 10, 'letter-spacing': '.1em', 'text-anchor': 'middle' });
  }
  line(X(2), R.y0, X(2), bottom, W.YELLOW, { 'stroke-width': 1.6, class: 'flow' });
  txt(X(2), bottom + 16, '2×  THE BAR', { class: 'ye', 'font-size': 10, 'letter-spacing': '.1em', 'text-anchor': 'middle' });
  // the reading cursor: a hairline frame that walks the rows
  const cursor = el('rect', { x: pad - 10, y: 0, width: R.x1 - pad + 60, height: R.rowH - 8, fill: 'none', stroke: W.WHITE, 'stroke-width': 1, opacity: .35 });
  const rows = PUSHES.map((p, i) => {
    const y = R.y0 + i * R.rowH + 22, g = el('g');
    const hit = p.peak >= 2, colour = hit ? W.GREEN : W.GRAPHITE;
    txt(pad, y + 4, p.t, { class: 'c', 'font-size': 11, 'letter-spacing': '.06em' }, g);
    el('rect', { x: pad + 58, y: y - 8, width: p.kind === 'BURST' ? 52 : 62, height: 17, rx: 999, fill: 'none', stroke: p.kind === 'BURST' ? W.YELLOW : W.VIOLET }, g);
    txt(pad + 58 + (p.kind === 'BURST' ? 26 : 31), y + 4, p.kind, { fill: p.kind === 'BURST' ? W.YELLOW : '#b48cff', 'font-size': 8.5, 'letter-spacing': '.12em', 'text-anchor': 'middle', 'font-weight': 700 }, g);
    const name = txt(pad + 136, y + 5, `$${p.sym}`, { fill: W.WHITE, 'font-size': 15, 'font-weight': 700, 'letter-spacing': '.04em' }, g);
    const w = X(p.peak) - R.x0;
    const bar = el('rect', { x: R.x0, y: y - 9, width: w, height: 18, fill: colour, opacity: hit ? .9 : .7 }, g);
    const lit = el('rect', { x: R.x0, y: y - 9, width: 0, height: 18, fill: W.WHITE, opacity: 0 }, g);   // the scan's light on the bar
    const lab = txt(R.x0 + w + 8, y + 4.5, `${p.peak.toFixed(2)}×`, { fill: colour, 'font-size': 13, 'font-weight': 700, 'letter-spacing': '.04em' }, g);
    if (p.note) txt(R.x0 + w + 62, y + 4, p.note, { class: 'g', 'font-size': 9.5, 'letter-spacing': '.04em' }, g);
    if (p.now > 1) { const nx = X(p.now); line(nx, y - 13, nx, y + 13, W.WHITE, { 'stroke-width': 1.2, opacity: .9 }, g); txt(nx, y - 16, `now ${p.now.toFixed(2)}×`, { class: 'g', 'font-size': 8.5, 'letter-spacing': '.06em', 'text-anchor': 'middle' }, g); }
    txt(R.x1 + 14, y + 5, hit ? '✓' : '·', { fill: colour, 'font-size': 14, 'font-weight': 700, class: hit ? 'breathe' : '' }, g);
    // energy along the bars that made it: a bright head running 1x to the peak
    const spark = hit ? el('rect', { x: R.x0, y: y - 9, width: 26, height: 18, fill: W.WHITE, opacity: 0 }, g) : null;
    return { p, y, hit, w, bar, lit, lab, name, spark, phase: i * .37 };
  });

  // ── the stats column
  const S = { x: 1130, y0: 262, gap: 112 };
  line(S.x - 30, 208, S.x - 30, 680, W.CARBON);
  const STATS = [[`${HIT.length}/${PUSHES.length}`, 'REACHED 2×', 'gr'], ['7.9×', 'BEST · SWARM · 5 WALLETS IN 3m 41s', 'gr'], [`${median.toFixed(1)}×`, 'MEDIAN PEAK', '']];
  const stats = STATS.map(([v, k, cls], i) => {
    const y = S.y0 + i * S.gap;
    const vEl = txt(S.x, y + 22, v, { class: 'sans b ' + cls, 'font-size': 60, 'letter-spacing': '-.01em' });
    txt(S.x, y + 46, k, { class: 'g', 'font-size': 10.5, 'letter-spacing': '.14em' });
    return vEl;
  });
  // a light that passes over the big numbers now and then
  const shine = el('rect', { x: S.x, y: S.y0 - 30, width: 40, height: 3 * S.gap, fill: W.WHITE, opacity: 0 });

  // ── the day: joins by the hour, and where the pushes fell
  const D = { x0: pad, x1: 1540, y0: 748, y1: 826, h0: 10, h1: 33 };
  const DX = (h) => D.x0 + (h - D.h0) / (D.h1 - D.h0) * (D.x1 - D.x0);
  txt(pad, 694, 'THE DAY  ·  WHO JOINED THE BOT, BY THE HOUR  ·  AND WHEN EACH PUSH WENT OUT', { class: 'g', 'font-size': 11, 'letter-spacing': '.13em' });
  line(D.x0, D.y1, D.x1, D.y1, W.WHITE);
  for (let h = D.h0; h <= D.h1; h++) {
    const major = h % 3 === 0;
    line(DX(h), D.y1, DX(h), D.y1 + (major ? 7 : 3), major ? W.WHITE : W.CARBON);
    if (major) txt(DX(h), D.y1 + 21, String(h % 24).padStart(2, '0') + ':00', { class: 'g', 'font-size': 9.5, 'letter-spacing': '.1em', 'text-anchor': 'middle' });
  }
  const maxJ = Math.max(...JOINS.map((j) => j[1]));
  const joinBars = JOINS.map(([h, n]) => { const hh = (n / maxJ) * (D.y1 - D.y0); return el('rect', { x: DX(h) + 2, y: D.y1 - hh, width: DX(h + 1) - DX(h) - 4, height: hh, fill: W.AMBER, opacity: .85 }); });
  txt(DX(17) + 6, D.y1 - 48, '73 IN AN HOUR · 15:00', { class: 'am', 'font-size': 9.5, 'font-weight': 700, 'letter-spacing': '.1em' });
  PUSHES.forEach((p) => {
    const x = DX(p.h), colour = p.peak >= 2 ? W.GREEN : W.GRAPHITE;
    line(x, D.y0 - 2, x, D.y1, colour, { 'stroke-width': 1.2 });
    txt(x, D.y0 - 6, '▲', { fill: colour, 'font-size': 10, 'text-anchor': 'middle', class: 'mark' });
  });
  const LAB = [['11:07', 'Maple', 0], ['13:55', 'AMD', 1], ['14:08', 'FRONTIER', 0], ['14:41', 'SWARM', 1], ['14:56', 'LONGCAT', 2], ['19:56', 'TWINE', 0], ['21:01', 'UNITY', 0]];
  LAB.forEach(([t, s, lvl]) => { const p = PUSHES.find((x) => x.t === t); txt(DX(p.h) + 5, D.y0 - 18 - lvl * 11, s, { fill: p.peak >= 2 ? W.GREEN : W.GRAPHITE, 'font-size': 9, 'font-weight': 700, 'letter-spacing': '.06em' }); });
  const sweep = el('rect', { x: D.x0, y: D.y0 - 4, width: 34, height: D.y1 - D.y0 + 4, fill: W.WHITE, opacity: 0 });

  // ── foot
  line(pad, 848, 1540, 848, W.CARBON);
  txt(pad, 876, 'FOMORADAR.APP  ·  @FOMORADARRH_BOT  ·  OPEN SOURCE', { 'font-size': 11, 'letter-spacing': '.13em' });
  txt(1540, 876, 'THE PEAK IS THE POOL’S HIGH AFTER THE MESSAGE  ·  RESEARCH, NOT FINANCIAL ADVICE', { class: 'g', 'font-size': 11, 'letter-spacing': '.13em', 'text-anchor': 'end' });

  // the scan: a thin light crossing the race from 1x to 10x, brightening what it touches
  const scan = el('line', { x1: R.x0, y1: R.y0 - 4, x2: R.x0, y2: bottom + 4, stroke: W.WHITE, 'stroke-width': 1.2, opacity: 0 });

  // ── the brain, small, top right: turning, scanned, firing
  const brainDraw = (() => {
    const cv = document.getElementById('brain'), pr = window.devicePixelRatio || 1, Wc = 210, Hc = 150;
    cv.width = Wc * pr; cv.height = Hc * pr; const c = cv.getContext('2d'); c.setTransform(pr, 0, 0, pr, 0, 0);
    const BCX = Wc * .5, BCY = Hc * .5, BSCALE = 58, k = BSCALE / 200; let s2 = 7;
    const r2 = () => { s2 ^= s2 << 13; s2 >>>= 0; s2 ^= s2 >> 17; s2 ^= s2 << 5; s2 >>>= 0; return s2 / 4294967296; }; const rr = (a, b) => a + r2() * (b - a);
    const PTS = []; const push = (x, y, z, tint, w, b) => PTS.push({ x, y, z, ph: rr(0, 6.28), sp: rr(.25, .9), amp: rr(.003, .012), b, tint, w, fire: 0 });
    const hemiR = (u, v) => { const f = Math.cos(u), up = Math.cos(v); let R = 1; R *= 1 + .1 * f - .16 * f * f; R *= up > 0 ? 1 + .1 * up : 1 - .46 * Math.abs(up); R *= 1 + .2 * Math.max(0, -up) * Math.max(0, f) * 1.5; R *= 1 + .055 * Math.sin(u * 3 + v * 2); return R; };
    const gy = (u, v) => Math.sin(u * 7.5 + v * 4.2) * Math.sin(v * 5.5 - u * 2.1);
    for (let i = 0; i < 2600; i++) { const side = r2() < .5 ? -1 : 1, u = rr(0, 6.28), v = Math.acos(rr(-1, 1)), g = gy(u, v); if (r2() > .3 + .7 * ((g + 1) / 2)) continue; const sh = r2() < .82 ? rr(.9, 1) : rr(.45, .9), R = hemiR(u, v) * sh * (1 + g * .045); const x = Math.sin(v) * Math.cos(u) * .5 * R + side * .235; if (Math.abs(x) < .052) continue; push(x, Math.cos(v) * .385 * R - .045, Math.sin(v) * Math.sin(u) * .415 * R, 0, rr(.9, 2.1), clamp(.3 + ((g + 1) / 2) * .62 + rr(-.1, .1), .06, 1)); }
    for (let i = 0; i < 700; i++) { const u = rr(0, 6.28), v = Math.acos(rr(-1, 1)), sh = r2() < .8 ? rr(.88, 1) : rr(.5, .88), f = Math.sin(v * 22) * .5 + .5; if (r2() > .25 + .75 * f) continue; const R = (1 - .22 * Math.max(0, Math.cos(v))) * sh; push(Math.sin(v) * Math.cos(u) * .27 * R, Math.cos(v) * .138 * R + .362, Math.sin(v) * Math.sin(u) * .215 * R - .3, 1, rr(.6, 1.4), clamp(.34 + f * .5 + rr(-.08, .08), .1, 1)); }
    for (let i = 0; i < 220; i++) { const t = r2(), w = .115 - t * .052, a = rr(0, 6.28), on = r2() < .75, q2 = on ? w : w * Math.sqrt(r2()); push(Math.cos(a) * q2, .36 + t * .46, Math.sin(a) * q2 - .075, 2, rr(.6, 1.3), clamp(.3 + (on ? .4 : .05) + rr(-.08, .08), .1, 1)); }
    const TINT = [[180, 235, 255], [120, 255, 205], [150, 205, 255]]; let fireT = 0;
    return (T, dt) => { fireT -= dt; if (fireT <= 0) { fireT = 1.1; const fo = [rr(-.4, .4), rr(-.3, .3), rr(-.3, .3)]; for (const p of PTS) if ((p.x - fo[0]) ** 2 + (p.y - fo[1]) ** 2 + (p.z - fo[2]) ** 2 < .05) p.fire = 1; }
      c.clearRect(0, 0, Wc, Hc); const yaw = T * .3, roll = Math.sin(T * .21) * .26, cy0 = Math.cos(yaw), sy0 = Math.sin(yaw), cr = Math.cos(roll), sr = Math.sin(roll);
      const scanD = ((T * .155) % 1) * 1.5 - .75, sa = T * .11, nx = Math.cos(sa), nz = Math.sin(sa);
      for (const p of PTS) { const br = 1 + Math.sin(T * p.sp + p.ph) * p.amp * 3.2, x = p.x * br, y = p.y * br, z = p.z * br; const Xr = x * cy0 + z * sy0; let Z = -x * sy0 + z * cy0; const Y = y * cr - Z * sr; Z = y * sr + Z * cr; const ps = 2.1 / (2.1 + Z * .9), sx = BCX + Xr * BSCALE * ps, sy = BCY + Y * BSCALE * ps, d = clamp((1.1 - Z) / 2.2, 0, 1);
        p.fire *= .93; const sc2 = Math.abs(x * nx + z * nz - scanD) < .045 ? 1 : 0, a = clamp((.13 + p.b * .8) * (.42 + d * .58) + sc2 * .5 + p.fire * .5, 0, 1);
        const tc = p.fire > .15 ? [0, 255, 133] : TINT[p.tint]; c.fillStyle = `rgba(${tc[0]},${tc[1]},${tc[2]},${a.toFixed(2)})`; const sz = Math.max(.6, p.w * (.55 + d * .85) * ps * k * (1 + sc2 * .6 + p.fire * .8)); c.fillRect(sx, sy, sz * 1.6, sz * 1.6); }
      for (const sd of [-1, 1]) { const ex = BCX + sd * BSCALE * .17, ey = BCY - BSCALE * .06, ew = BSCALE * .052, eh = BSCALE * .066; c.fillStyle = 'rgba(2,5,10,.96)'; c.beginPath(); c.ellipse(ex, ey, ew, eh, 0, 0, 7); c.fill(); c.strokeStyle = 'rgba(150,220,255,.8)'; c.lineWidth = 1; c.stroke(); c.fillStyle = W.GREEN; c.beginPath(); c.arc(ex + ew * .3, ey - eh * .1, ew * .42, 0, 7); c.fill(); } };
  })();

  // ── the light: everything is already on the board; this is what moves
  const render = (t) => {
    // the scan across the race, 1x to 10x, every seven seconds
    const sp = (t % 7) / 7, sx = R.x0 + sp * (R.x1 - R.x0);
    scan.setAttribute('x1', sx); scan.setAttribute('x2', sx); scan.setAttribute('opacity', .45 + .35 * Math.sin(sp * Math.PI));
    rows.forEach((r) => {
      // the part of the bar the scan has passed glows for a moment, the peak label brightens
      const passed = clamp(sx - R.x0, 0, r.w), fresh = Math.max(0, 1 - (sx - R.x0 - r.w) / 90);
      r.lit.setAttribute('width', passed); r.lit.setAttribute('opacity', sx < R.x0 + r.w ? .18 : .18 * clamp(fresh, 0, 1));
      r.lab.setAttribute('opacity', sx > R.x0 + r.w && sx < R.x0 + r.w + 90 ? 1 : .85);
      // energy running along the bars that made it
      if (r.spark) { const u = ((t * .55 + r.phase) % 1); r.spark.setAttribute('x', R.x0 + u * Math.max(1, r.w - 26)); r.spark.setAttribute('opacity', .22 * Math.sin(u * Math.PI)); }
    });
    // the reading cursor walks the rows, a second and a half each
    const ci = Math.floor(t / 1.5) % rows.length, cy = rows[ci].y;
    cursor.setAttribute('y', cy - 22); cursor.setAttribute('opacity', .25 + .15 * Math.sin((t % 1.5) / 1.5 * Math.PI));
    rows.forEach((r, i) => r.name.setAttribute('fill', i === ci ? (r.hit ? W.GREEN : W.WHITE) : W.WHITE));
    // a light over the big numbers every nine seconds
    const shp = (t % 9) / 9; shine.setAttribute('x', S.x - 40 + shp * 420); shine.setAttribute('opacity', shp < .35 ? .07 * Math.sin(shp / .35 * Math.PI) : 0);
    stats[0].setAttribute('opacity', .88 + .12 * Math.sin(t * 1.6));
    // the day: a sweep through the hours, the join wave shimmering under it
    const dp = (t % 6) / 6, dx = D.x0 + dp * (D.x1 - D.x0);
    sweep.setAttribute('x', dx); sweep.setAttribute('opacity', .06);
    JOINS.forEach(([h], i) => { const bx = DX(h); const near = Math.max(0, 1 - Math.abs(dx - bx) / 60); joinBars[i].setAttribute('opacity', .8 + .2 * near); });
  };
  let start = performance.now(), last = start;
  const loop = () => { const now = performance.now(), t = (now - start) / 1000, dt = Math.min(.05, (now - last) / 1000); last = now; render(t); brainDraw(4.33 + t, dt); requestAnimationFrame(loop); };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { if (reduced) { render(2.4); brainDraw(4.33, 0); } else requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
