# Every service here logs to the journal, and Caddy logs every request. Uncapped, that grows
# without bound on a box whose whole job is to keep a database. A gigabyte held twenty-one hours
# once the site had bots (822k Caddy lines a day); four is a fortnight, and the daily report
# reads a day. The API's own access log is off (Caddy has it), which halves the rate.
#
# Goes in /etc/systemd/journald.conf.d/ ; systemctl restart systemd-journald to apply.
[Journal]
SystemMaxUse=4G
MaxRetentionSec=30day
