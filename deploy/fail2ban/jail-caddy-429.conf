# Three hundred 429s inside a minute from one address is nobody's browser: an hour off. Goes in
# /etc/fail2ban/jail.d/caddy-429.conf ; systemctl restart fail2ban to apply.
[caddy-429]
enabled = true
backend = systemd
journalmatch = _SYSTEMD_UNIT=caddy.service
filter = caddy-429
maxretry = 300
findtime = 1m
bantime = 1h
