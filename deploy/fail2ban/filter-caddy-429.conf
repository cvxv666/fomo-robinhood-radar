# An address the rate limiter turns away hundreds of times a minute is a scanner (130.49.215.97
# walked /token/* forty thousand times under a Mozilla string on 21 Sep); the limiter held, but
# every one of those requests still cost a worker. Caddy logs every request to the journal as
# JSON; this reads the client and the status from each line.
#
# Goes in /etc/fail2ban/filter.d/caddy-429.conf
[Definition]
failregex = "client_ip":"<HOST>".*"status":429
ignoreregex =
